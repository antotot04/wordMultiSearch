<!DOCTYPE html>
<html lang="en-uk">
    <head>
        <title>Word multi search</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>Word multi search</h1>
            <p>allows you to search for different resources about a word you want to learn</p>
            <form>
                <label for="search-word">Insert your word here: </label>
                <div>
                    <input type="text" id="search-word" name="word">
                    <p hidden class="form-error">Word cannot be empty</p>
                </div>
                <button type="submit">Search</button>
            </form>
        </main>
        <footer>
            <small>© 2026 Antonio Totaro</small>
            <a target="_blank" href="https://github.com/antotot04">antotot04</a>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
